# Publishes the two surfaces to GitHub Pages.
#
# Both are fully static: the 125 072 measurements are baked into the bundle at build time (7,9 Mo
# apres encodage par colonne), so the verdict, the table, the curve and the permission LEDs work
# with no backend at all. The assistant and the graph insets are the only parts that need a
# server, and both now distinguish « aucun serveur publie pour cette version » from « le serveur
# est en panne » — deux etats que le visiteur ne peut pas trancher lui-meme.
#
#   /        the presentation page  (~14 kB gzip before the verdict is readable)
#   /hooks/  the instrument
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # Rend base_path : « /<depot> » sur une page de projet, « » sur une page d'utilisateur.
      - id: pages
        uses: actions/configure-pages@v5

      # GitHub Pages sert un depot de PROJET sous /<depot>/, pas sous /. Sans ces deux
      # variables, les deux surfaces se construisent avec des chemins absolus qui pointent a
      # la racine du domaine : les polices, l'icone et le module d'amorcage rendent 404, et
      # le seul lien qui mene a l'instrument mene nulle part.
      - name: Ou le site sera servi
        run: |
          BASE="${{ steps.pages.outputs.base_path }}"
          [ -n "$BASE" ] || BASE="/${GITHUB_REPOSITORY#*/}"
          BASE="${BASE%/}/"
          echo "SITE_BASE=$BASE" >> "$GITHUB_ENV"
          echo "sous-chemin du site : $BASE"

      # OU LES DEUX SURFACES IRONT CHERCHER L'API, si elle existe.
      #
      # Sans ces variables, le paquet publie porte `http://127.0.0.1:8787` en dur : sur une
      # URL publique, les encarts du graphe et l'assistant affichent donc « 127.0.0.1
      # injoignable » a un visiteur, ce qui se lit comme « ce site est casse » et pas comme
      # « il n'y a pas d'API publiee ».
      #
      # Elles sont FACULTATIVES et la construction ne les exige pas : le verdict, la table,
      # la courbe et les diodes viennent du paquet et ne demandent aucun serveur. Quand elles
      # sont absentes, les deux surfaces disent maintenant « aucune API publiee pour cette
      # version », ce qui est la verite.
      #
      # Pour les poser : Settings -> Secrets and variables -> Actions -> Variables ->
      #   TARE_API        https://api.exemple.tld
      #   ASSISTANT_URL   https://api.exemple.tld/assistant
      - name: Ou l'API sera cherchee
        run: |
          A="${{ vars.TARE_API }}"
          B="${{ vars.ASSISTANT_URL }}"
          echo "VITE_TARE_API=$A" >> "$GITHUB_ENV"
          echo "VITE_ASSISTANT_URL=$B" >> "$GITHUB_ENV"
          if [ -n "$A" ]; then echo "API      : $A"; else
            echo "API      : AUCUNE — les encarts du graphe diront qu'aucune n'est publiee"; fi
          if [ -n "$B" ]; then echo "assistant: $B"; else
            echo "assistant: AUCUN — le panneau le dira, au lieu d'annoncer une panne"; fi

      - name: Build the presentation page
        working-directory: apps/landing
        run: npm ci && npm run build
        env:
          BASE_URL: ${{ env.SITE_BASE }}

      # verify.mjs recounts every published claim against the raw dataset; if the page states
      # something the measurements do not support, the deploy stops here rather than shipping it.
      - name: Build the instrument, and check what it claims
        working-directory: apps/web
        run: npm ci && npm run build
        env:
          BASE_URL: ${{ env.SITE_BASE }}hooks/
          VITE_TARE_API: ${{ env.VITE_TARE_API }}
          VITE_ASSISTANT_URL: ${{ env.VITE_ASSISTANT_URL }}

      - name: Assemble
        run: |
          mkdir -p _site
          cp -r apps/landing/dist/* _site/
          mkdir -p _site/hooks
          cp -r apps/web/dist/* _site/hooks/
          # No Jekyll: filenames starting with an underscore must survive.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
