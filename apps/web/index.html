      <!-- AUCUN CHIFFRE ICI. Ce bloc en portait quatre, ecrits a la main et perimes depuis
           longtemps — 128 mesures quand le corpus en compte plus de cent vingt mille. Sur un
           produit dont toute la these est qu'un chiffre publie doit etre verifiable, un chiffre
           faux dans le repli sans JavaScript est la pire faute possible. Les comptes vivent
           dans le corpus, et le corpus a besoin du script : on renvoie donc au depot. -->
      <p style="font-family: monospace; color: #e8eaed; padding: 24px; line-height: 1.6">
        TARE mesure ce qu'un hook Uniswap v4 prend sur un swap&nbsp;: le même swap est coté deux
        fois sur un fork épinglé, une fois avec le hook, une fois contre un talon inerte de
        89&nbsp;octets, et l'écart est le prélèvement. L'instrument a besoin de JavaScript pour
        lire son corpus, qui est embarqué dans la page. Le corpus brut et les commandes qui le
        rejouent sont dans le dépôt&nbsp;:
        <a href="https://github.com/JeanBaptisteDurand/ETH_Online_2026" style="color: #e8eaed"
          >github.com/JeanBaptisteDurand/ETH_Online_2026</a
        >.
      </p>
