# Le deploiement : le service x402 en ligne, avec TLS.
#
#   BASE_RPC_URL=...  TARE_DOMAIN=tare.exemple.fr  TARE_DB_PASSWORD=<un vrai mot de passe> \
#     docker compose -f docker-compose.deploy.yml up -d
#
# Cinq conteneurs, et aucun de trop :
#
#   db     Postgres. Les NEUF routes du compte en dependent : connexion par portefeuille,
#          cles d'API, historique, telechargements. Sans elle, elles rendent 503 — et
#          c'etait le cas, ce fichier n'embarquait aucune base.
#   assistant  le second serveur, sur 8788. Rien ne le lancait, donc le panneau de
#          conversation du site pointait vers un service inexistant.
#   anvil  le fork Base epingle au bloc 50614000. C'est LUI qui rend la mesure possible :
#          anvil_setCode remplace le bytecode du hook par le stub inerte. Sans fork, pas
#          de contrefactuel, donc pas de mesure — seulement un jeu de donnees a relire.
#   api    l'API x402 + le moteur Python.
#   caddy  TLS automatique (Let's Encrypt). Le track Hedera demande un service EN LIGNE ;
#          un service en ligne sans TLS n'est pas un service en ligne, c'est une demo.
#
# Ce qui coute de l'argent en production, mesure et pas suppose (proxy compteur devant
# Alchemy) : le demarrage a froid du fork vaut 43 requetes amont, la toute premiere mesure
# +70, chaque pool neuf +13, et un pool deja mesure 0. Donc la regle d'exploitation est
# simple : NE PAS redemarrer anvil. `restart: unless-stopped` est la pour ca. Le volume de
# cache, lui, ne sauve rien — anvil 1.8.1 n'ecrit jamais son cache de fork sur disque.
services:
  # LA BASE. Sans elle, les NEUF routes du compte rendent 503 « aucune base n'est
  # configuree » — donc pas de connexion par portefeuille, pas de cle d'API, pas
  # d'historique, pas de telechargement. Ce fichier n'en embarquait aucune, et ne passait
  # ni DATABASE_URL ni TARE_PG_DSN : la moitie du produit etait injoignable sur la machine
  # hebergee sans qu'aucun message ne le dise autrement que par un 503.
  #
  # AUCUN PORT N'EST PUBLIE. Une base exposee sur l'internet public avec le mot de passe
  # « tare » est une base ouverte a tous. Seuls les conteneurs du reseau compose la voient,
  # et c'est tout ce dont ils ont besoin.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tare
      POSTGRES_PASSWORD: ${TARE_DB_PASSWORD:?TARE_DB_PASSWORD est obligatoire — ne deploie pas avec le mot de passe de developpement}
      POSTGRES_DB: tare
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tare"]
      interval: 5s
      timeout: 5s
      retries: 20

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    # L'ENTRYPOINT de l'image est ["/bin/sh","-c"] : la commande doit lui arriver en UN
    # seul argument. Une chaine YAML ne suffit pas — Compose la decoupe, et `sh -c` prend
    # alors "anvil" pour tout le script. Une liste a un element est la seule forme juste.
    command: ["anvil --fork-url ${BASE_RPC_URL} --fork-block-number ${FORK_BLOCK:-50614000} --host 0.0.0.0 --port 8545 --compute-units-per-second 200000 --silent"]
    # L'image tourne en uid 1000 (foundry), HOME=/home/foundry. Monter le cache sur
    # /root/.foundry/cache — ce que faisait ce fichier — le rend INACCESSIBLE au processus :
    # il ne peut pas y ecrire, et ce n'est pas la qu'il le cherche. Le volume restait vide
    # (4 Ko, zero fichier) et CHAQUE demarrage refaisait tout l'etat contre le RPC payant.
    volumes: ["foundry_cache:/home/foundry/.foundry/cache"]
    user: "1000:1000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD","sh","-c","cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8787
      TARE_RPC_URL: http://anvil:8545
      FORK_BLOCK: ${FORK_BLOCK:-50614000}
      # Le peage. X402_ENABLED=0 le couperait — ce serait rendre le service gratuit
      # ET perdre l'exigence du track. On ne le coupe pas en production.
      X402_ENABLED: "1"
      HEDERA_NETWORK: ${HEDERA_NETWORK:-hedera:testnet}
      BLOCKY402_URL: ${BLOCKY402_URL:-https://api.testnet.blocky402.com}
      HEDERA_FEE_PAYER: ${HEDERA_FEE_PAYER}
      HEDERA_PAY_TO: ${HEDERA_PAY_TO}
      TARE_UNIT_PRICE_USD: ${TARE_UNIT_PRICE_USD:-0.001}
      TARE_MAX_UNITS: ${TARE_MAX_UNITS:-10}
      # Le journal d'audit HCS. Absent, /usage le DIT au lieu de faire semblant.
      HEDERA_HCS_TOPIC_ID: ${HEDERA_HCS_TOPIC_ID}
      HEDERA_PAYER_ACCOUNT_ID: ${HEDERA_PAYER_ACCOUNT_ID}
      HEDERA_PAYER_KEY_TYPE: ${HEDERA_PAYER_KEY_TYPE:-ECDSA}
      # La cle qui SIGNE les ancrages HCS. En production elle vient du trousseau Ledger
      # (var/keyring.json, monte en lecture seule) ; l'environnement reste le repli, et
      # le service annonce lequel il a utilise.
      HEDERA_PAYER_PRIVATE_KEY: ${HEDERA_PAYER_PRIVATE_KEY:-}
      TARE_KEYRING: /srv/tare/var/keyring.json
      # Les comptes. `tare_pg_dsn` gagne sur `database_url` cote code ; on pose les deux
      # parce que d'autres modules lisent l'une ou l'autre.
      TARE_PG_DSN: postgresql://tare:${TARE_DB_PASSWORD}@db:5432/tare
      DATABASE_URL: postgresql://tare:${TARE_DB_PASSWORD}@db:5432/tare
      # L'abonnement, LU sur la chaine. Absentes, GET /compte repond « abonnement non
      # verifie, donc pas actif » : un refus motive, pas une panne — mais un refus.
      TARE_ABONNEMENT_CONTRAT: ${TARE_ABONNEMENT_CONTRAT:-}
      TARE_ABONNEMENT_RPC: ${TARE_ABONNEMENT_RPC:-}
      TARE_ABONNEMENT_CHAIN_ID: ${TARE_ABONNEMENT_CHAIN_ID:-84532}
      # Le noeud de POST /alternative : cotation vivante + les deux lectures Permit2. Ces
      # appels sont FACTURES ; la route ne les fait que si une porte mesuree moins chere
      # existe, ce qui arrive sur 15 des 125 072 lignes du corpus. A defaut du fork local,
      # qui est epingle a un bloc et ne peut donc pas coter « maintenant ».
      TARE_SUBSTITUTION_RPC: ${TARE_SUBSTITUTION_RPC:-}
    volumes:
      # Lecture seule : le service ouvre le trousseau, il ne le modifie jamais.
      - ./var:/srv/tare/var:ro
    depends_on:
      anvil: { condition: service_healthy }
      db: { condition: service_healthy }
    restart: unless-stopped

  # L'ASSISTANT. C'est un SECOND serveur, sur un autre port, et rien ne le lancait : le
  # panneau de conversation du site pointait donc vers un service inexistant. Meme image,
  # meme code, un autre point d'entree — il n'y a pas de raison d'en faire une seconde.
  assistant:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["tsx", "apps/api/src/assistant/server.ts"]
    environment:
      ASSISTANT_PORT: 8788
      TARE_RPC_URL: http://anvil:8545
      TARE_PG_DSN: postgresql://tare:${TARE_DB_PASSWORD}@db:5432/tare
      DATABASE_URL: postgresql://tare:${TARE_DB_PASSWORD}@db:5432/tare
      TARE_EMBED_MODEL: ${TARE_EMBED_MODEL:-granite-embedding:278m}
      OLLAMA_URL: ${OLLAMA_URL:-}
    depends_on:
      anvil: { condition: service_healthy }
      db: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      TARE_DOMAIN: ${TARE_DOMAIN:?TARE_DOMAIN est obligatoire — Caddy en a besoin pour le certificat}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, assistant]
    restart: unless-stopped

volumes:
  pgdata:
  foundry_cache:
  caddy_data:
  caddy_config:
