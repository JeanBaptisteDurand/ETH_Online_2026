services:
  # Fork Base epingle. Le volume de cache ne sert A RIEN et c'est mesure, pas suppose :
  # anvil 1.8.1 n'ecrit jamais son cache RPC de fork sur disque — ni en cours, ni a l'arret,
  # ni sur SIGINT. Il est garde parce qu'il ne coute rien et qu'une version future pourrait
  # s'en servir ; il n'economise pas une requete aujourd'hui. Ce qui economise, c'est de ne
  # PAS redemarrer ce conteneur : l'etat est mis en cache en RAM pour la duree de la session.
  # Cout amont mesure (proxy compteur devant Alchemy) :
  #   demarrage a froid ............... 43 requetes
  #   toute premiere mesure ........... +70  (chauffe PoolManager, V4Quoter, l'etat commun)
  #   chaque pool NEUF ensuite ........ +13
  #   un pool deja mesure ............. 0    (rien ne repart en amont)
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    # The image's ENTRYPOINT is ["/bin/sh","-c"], so the command must reach it as ONE
    # argument. A YAML string does NOT do that: Compose tokenises it, and `sh -c` then
    # takes "anvil" as the whole script and every flag as $0, $1, ... — anvil starts, but
    # bare: no fork, and listening on 127.0.0.1 inside the container, so the published
    # port answers nothing. A one-element list is the only form that keeps it whole.
    command: ["anvil --fork-url ${BASE_RPC_URL} --fork-block-number ${FORK_BLOCK:-50614000} --host 0.0.0.0 --port 8545 --compute-units-per-second 200000 --silent"]
    ports: ["8545:8545"]
    # L'image tourne en uid 1000 (foundry), HOME=/home/foundry. Monter le cache sur
    # /root/.foundry/cache — ce que faisait ce fichier — le rend INACCESSIBLE au processus :
    # il ne peut pas y ecrire, et ce n'est pas la qu'il le cherche. Le volume restait vide
    # (4 Ko, zero fichier) et CHAQUE demarrage refaisait tout l'etat contre le RPC payant.
    volumes: ["foundry_cache:/home/foundry/.foundry/cache"]
    user: "1000:1000"
    healthcheck:
      test: ["CMD","sh","-c","cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  db:
    image: pgvector/pgvector:pg16       # Postgres + the vector extension in one image
    environment:
      POSTGRES_USER: tare
      POSTGRES_PASSWORD: tare
      POSTGRES_DB: tare
    # Port hote surchargeable : sur la machine de dev, 5432 est deja pris par un
    # autre projet. TARE_DB_PORT=55432 suffit alors, et DATABASE_URL suit.
    ports: ["${TARE_DB_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U tare"]
      interval: 5s
      timeout: 5s
      retries: 20

  queue:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  foundry_cache:
  pgdata:
